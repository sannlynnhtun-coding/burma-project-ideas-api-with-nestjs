function flowPathLines(path){
 const lines=[''];
 for(const part of path.split('/').slice(1)){
  const token='/'+part;
  if((lines[lines.length-1]+token).length>30)lines.push(token);else lines[lines.length-1]+=token;
 }
 return lines.filter(Boolean);
}

let currentExample;

async function send(e){
 e.preventDefault();const d=currentExample;let path=d.path;const query=new URLSearchParams();
 for(const input of e.target.querySelectorAll('input')){if(input.dataset.location==='path')path=path.replace(':'+input.name,encodeURIComponent(input.value));else if(input.value)query.set(input.name,input.value)}
 const url=new URL(path,$('server').value);for(const [key,value] of query)url.searchParams.set(key,value);
 const options={method:d.method};
 if($('body')){try{options.body=JSON.stringify(JSON.parse($('body').value));options.headers={'Content-Type':'application/json'}}catch{$('status').textContent='INVALID JSON';$('response').textContent='Enter a valid JSON request body.';return}}
 const activeController=new AbortController();controller=activeController;options.signal=activeController.signal;const button=$('send');button.disabled=true;button.textContent='Sending…';$('status').textContent='LOADING';
 const started=performance.now();const timeout=setTimeout(()=>activeController.abort(),30000);
 try{const res=await fetch(url,options);const text=await res.text();if(controller!==activeController)return;try{$('response').textContent=JSON.stringify(JSON.parse(text),null,2)}catch{$('response').textContent=text}$('status').textContent=`${res.status} · ${Math.round(performance.now()-started)} ms`}

}

window.addEventListener('hashchange',()=>{if(location.hash==='#main'||location.hash==='#landing')return;render();window.scrollTo(0,0)});
render();
